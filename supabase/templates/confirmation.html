<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body style="margin:0;padding:0;background:#f7f3ee;font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:40px 16px">
      <div style="background:#ffffff;border:1px solid #e8e2da;border-radius:12px;padding:32px">
        <p style="margin:0 0 24px;font-size:18px;font-weight:600;color:#2f2f2f">Nookbud</p>
        <h1 style="margin:0 0 16px;font-size:22px;font-weight:600;line-height:1.3;color:#2f2f2f">Confirm your email</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.55;color:#524e4a">Confirm this address to finish setting up your Nookbud account.</p>
        <p style="margin:0 0 24px">
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/welcome" style="display:inline-block;background:#2f2f2f;color:#f7f3ee;text-decoration:none;font-size:14px;font-weight:500;padding:12px 18px;border-radius:8px">Confirm email</a>
        </p>
        <p style="margin:0;font-size:14px;line-height:1.5;color:#6e6a66">The link works once and expires in an hour.</p>
      </div>
      <p style="margin:24px 0 0;font-size:13px;color:#6e6a66;text-align:center">If you did not expect this email, you can ignore it. Nothing changes until you use the link.</p>
    </div>
  </body>
</html>
