<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="24" fill="#4A7C59"/>

  <!-- Nook: L-shaped corner, bottom-left, rounded -->
  <path
    d="M22 72 L22 38 Q22 34 26 34 L38 34"
    stroke="#FAF8F4"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Stem rising from nook corner -->
  <line
    x1="22" y1="60"
    x2="22" y2="48"
    stroke="#FAF8F4"
    stroke-width="6.5"
    stroke-linecap="round"
  />

  <!-- Left leaf -->
  <path
    d="M22 54 Q14 46 16 38 Q24 40 22 54"
    fill="#FAF8F4"
    opacity="0.85"
  />

  <!-- Right leaf -->
  <path
    d="M22 50 Q30 42 38 46 Q34 54 22 50"
    fill="#FAF8F4"
  />

  <!-- Bud tip (small rounded top) -->
  <ellipse
    cx="22" cy="44"
    rx="4.5" ry="5.5"
    fill="#FAF8F4"
  />
</svg>
