<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="24" fill="#4A7C59"/>

  <!-- Leaf shape — large, folded at bottom-right corner -->
  <!-- Main leaf body: sweeps from bottom-left to top-right -->
  <path
    d="M28 74 Q22 44 50 24 Q78 24 72 52 Q66 72 28 74 Z"
    fill="#FAF8F4"
    opacity="0.95"
  />

  <!-- Fold crease — the corner fold, bottom-right of leaf -->
  <path
    d="M72 52 Q74 68 60 74 Q66 64 72 52 Z"
    fill="#4A7C59"
    opacity="0.5"
  />

  <!-- Center vein -->
  <path
    d="M28 74 Q48 50 50 24"
    stroke="#4A7C59"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.3"
  />

  <!-- Small bud at tip of leaf -->
  <ellipse
    cx="50" cy="26"
    rx="5" ry="6"
    fill="#D4845A"
  />
</svg>
